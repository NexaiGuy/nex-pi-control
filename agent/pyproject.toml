[project]
name = "nex-pi-control-agent"
version = "1.2.6"
description = "Agent and admin shell for Nex Pi Control"
license = "MIT"
requires-python = ">=3.11"

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "B904", "E501", "E702", "SIM105", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
