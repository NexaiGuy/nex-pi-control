# Which actions may the app perform? After every change run:
#   sudo /opt/hal-agent/bin/hal-apply-config
# That rewrites the polkit rule. The agent also reads this file itself (double check).

# Services you may restart from the app (with or without .service)
restart:
  - nginx
  - docker
  # - home-assistant
  # - pihole-FTL

# Reboot and power off from the app (always hold 2 s and confirm with the server name)
power: true

# Restart Docker containers from the app (only `docker restart`, never stop or remove)
containers: true
# Containers that may never be restarted from the app
container_deny: []
  # - docker-socket-proxy

# Check and install system updates (apt-get upgrade, keeps your config files, never removes packages)
updates: true

# Update this agent from the app to the newest GitHub release, with automatic rollback
agent_update: true

# Set categories and "switched off on purpose" from the app (stored in /var/lib/hal-agent/labels.json, see groups.yml)
labels: true
